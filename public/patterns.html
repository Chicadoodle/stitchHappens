<!doctype html>
<html>
  <head>
    <title>Patterns</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="/components/navbar.js"></script>
  </head>
  <body>
    <div class="container">
      <h2>Patterns</h2>

      <div class="search-bar">
        <input id="searchInput" placeholder="Search patterns by title..." />
        <button onclick="search()">Search</button>
      </div>

      <div id="grid" class="card-grid"></div>
    </div>

    <script>
      async function load() {
        const res = await fetch('/api/patterns');
        const patterns = await res.json();
        render(patterns);
      }

      async function search() {
        const q = document.getElementById('searchInput').value;
        const res = await fetch('/api/patterns/search?q=' + encodeURIComponent(q));
        render(await res.json());
      }

      function render(patterns) {
        const grid = document.getElementById('grid');
        grid.innerHTML = patterns
          .map(
            (p) => `
      <div class="card">
        <h3>${p.title}</h3>
        <p><strong>Skill:</strong> ${p.skillLevel}</p>
        <p><strong>Yarn Size:</strong> ${p.yarnSize}</p>
        <p><strong>Skeins:</strong> ${p.skiensNeeded}</p>
        <pre>${p.instructions}</pre>
        <button onclick="favorite('${p.patternId}')">Favorite</button>
      </div>
    `,
          )
          .join('');
      }

      async function favorite(id) {
        await fetch('/api/favorites/patterns/' + id, { method: 'POST' });
        alert('Favorited!');
      }

      load();
    </script>
  </body>
</html>

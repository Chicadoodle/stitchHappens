<!doctype html>
<html>
  <head>
    <title>My Favorites</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="/components/navbar.js"></script>
  </head>

  <body>
    <div class="container">
      <h2>My Favorites</h2>

      <h3>Favorite Videos</h3>
      <div id="videoGrid" class="card-grid"></div>

      <h3 style="margin-top: 40px">Favorite Patterns</h3>
      <div id="patternGrid" class="card-grid"></div>
    </div>

    <script>
      async function loadFavorites() {
        const me = await fetch('/api/users/me')
          .then((r) => r.json())
          .catch(() => null);
        if (!me) {
          document.body.innerHTML =
            "<h2 style='text-align:center'>You must log in to view favorites.</h2>";
          return;
        }

        renderVideos(me.favoriteVideoIds);
        renderPatterns(me.favoritePatternIds);
      }

      async function renderVideos(ids) {
        const grid = document.getElementById('videoGrid');

        if (!ids.length) {
          grid.innerHTML = '<p>No favorite videos yet.</p>';
          return;
        }

        const cards = [];
        for (const id of ids) {
          const res = await fetch(`/api/videos/${id}`);
          if (!res.ok) continue;
          const v = await res.json();

          cards.push(`
        <div class="card">
          <button class="heart-btn heart-filled"
            onclick="toggleFavorite('videos', '${v.videoId}', this)">
            ♥
          </button>

          <h3>${v.title}</h3>
          <p><strong>Skill:</strong> ${v.skillLevel}</p>
          <p><strong>Yarn Size:</strong> ${v.yarnSize}</p>
          <p><strong>Skeins:</strong> ${v.skiensNeeded}</p>

          <a href="${v.videoUrl}" target="_blank">Watch</a>
        </div>
      `);
        }

        grid.innerHTML = cards.join('');
      }

      async function renderPatterns(ids) {
        const grid = document.getElementById('patternGrid');

        if (!ids.length) {
          grid.innerHTML = '<p>No favorite patterns yet.</p>';
          return;
        }

        const cards = [];
        for (const id of ids) {
          const res = await fetch(`/api/patterns/${id}`);
          if (!res.ok) continue;
          const p = await res.json();

          cards.push(`
        <div class="card">
          <button class="heart-btn heart-filled"
            onclick="toggleFavorite('patterns', '${p.patternId}', this)">
            ♥
          </button>

          <h3>${p.title}</h3>
          <p><strong>Skill:</strong> ${p.skillLevel}</p>
          <p><strong>Yarn Size:</strong> ${p.yarnSize}</p>
          <p><strong>Skeins:</strong> ${p.skiensNeeded}</p>

          <pre>${p.instructions}</pre>
        </div>
      `);
        }

        grid.innerHTML = cards.join('');
      }

      async function toggleFavorite(type, id, el) {
        await fetch(`/api/favorites/${type}/${id}`, { method: 'DELETE' });
        loadFavorites();
      }

      loadFavorites();
    </script>
  </body>
</html>
